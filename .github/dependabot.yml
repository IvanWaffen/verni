version: 2
# Minor and patch updates are grouped; major updates arrive as separate PRs.
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint must support a new TypeScript major first
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Types follow the Node.js LTS used at runtime
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule:
      interval: weekly
    ignore:
      # Runtime majors (Node.js, Java) move only to LTS releases, manually
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "build(deps)"
