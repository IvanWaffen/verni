name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    steps:
      # The PR title becomes the squash commit message on main (Conventional Commits)
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            build
            ci
            chore
          scopes: |
            identity
            listings
            discovery
            responses
            messaging
            media
            moderation
            notifications
            audit
            demo
            shared
            backend
            frontend
            infra
            ci
            docs
            deps
          requireScope: false
