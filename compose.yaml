# Local development dependencies. Run: docker compose up -d
services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: verni
      POSTGRES_USER: verni
      POSTGRES_PASSWORD: verni
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verni -d verni"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  postgres-data:
